<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Botfusions AI Reel</title>
<meta name="description" content="Botfusions'ı 30 saniyede, 120 BPM vuruşlarına kesilen kinetik tipografi ve hareketli grafiklerle anlatan reel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Bilinçli olarak tek görsel dünya: krem/siyah zeminler + Botfusions renkleri */
:root{--ink:#0C0B10;--cream:#E9E4D8;--p:#A855F7;--o:#F97316;--line:rgba(233,228,216,.14);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--cream);overflow:hidden;font-family:"JetBrains Mono",ui-monospace,monospace}
#cv{position:absolute;left:50%;top:50%;transform-origin:center;display:block;background:var(--ink)}
.ui{position:fixed;z-index:3;transition:opacity .5s}
#ctl{left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:rgba(12,11,16,.78);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:calc(100vw - 32px)}
#ctl.idle{opacity:0}
button{appearance:none;border:0;background:transparent;color:var(--cream);font:700 13px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.04em;padding:10px 13px;border-radius:999px;cursor:pointer;min-height:40px;white-space:nowrap}
button:hover{background:rgba(233,228,216,.1)}
button:focus-visible{outline:2px solid var(--p);outline-offset:2px}
#play{background:var(--p);min-width:44px}
.dots{display:flex;gap:2px}
.dots button{width:34px;padding:0;display:grid;place-items:center}
.dots button::after{content:"";width:10px;height:10px;background:rgba(233,228,216,.3)}
.dots button.on::after{background:var(--cream)}
#clock{font-size:12px;opacity:.7;padding:0 8px;min-width:58px;font-variant-numeric:tabular-nums}
#start{inset:0;display:grid;place-items:center;background:rgba(12,11,16,.55)}
#start button{font-size:16px;padding:16px 26px;background:var(--p);min-height:52px}
#start small{display:block;margin-top:14px;text-align:center;opacity:.7;font-size:12px;letter-spacing:.08em}
.hidden{opacity:0;pointer-events:none}
@media (max-width:480px){#clock{display:none}button{padding:10px}}
</style>
</head>
<body>
<canvas id="cv" role="img" aria-label="Botfusions reel: sorun, çözüm, üç adım, kanıt ve imza"></canvas>
<div id="start" class="ui"><div><button id="go">▶ Sesli oynat</button><small>30 SN · 120 BPM</small></div></div>
<div id="ctl" class="ui hidden">
  <button id="play" aria-label="Duraklat">❚❚</button>
  <button id="replay">↺ Baştan</button>
  <div class="dots" id="dots"></div>
  <span id="clock">00.0 / 30</span>
  <button id="mute">SES AÇIK</button>
</div>
<script>
(()=>{
'use strict';
// ================================================================ içerik
// KANIT: doğrulanmış rakamını yaz; value sayı olunca sayaç çalışır. Örn: {value:3,prefix:'',suffix:'X',label:'AI YANITLARINDA DAHA SIK ÖNERİLME'}
const PROOF={value:null,prefix:'',suffix:'',label:'BURAYA DOĞRULANMIŞ RAKAM GELECEK'};

const QS=new URLSearchParams(location.search), RENDER=QS.has('render');
const DUR=30, BPM=120, FPS=30;
const SEC=[0,5.75,12,21,26], SECN=['SORUN','ÇÖZÜM','NASIL ÇALIŞIR','KANIT','İMZA'];
const C={cream:'#E9E4D8',paper:'#F3EFE6',ink:'#0C0B10',card:'#17122B',p:'#A855F7',pd:'#7C3AED',b:'#3B82F6',o:'#F97316',y:'#FDE047',navy:'#160E2A'};
const REDUCED=!RENDER&&matchMedia('(prefers-reduced-motion: reduce)').matches;

// ================================================================ yardımcılar
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,x)=>a+(b-a)*x, TAU=Math.PI*2;
const E={
  lin:t=>t, out:t=>1-(1-t)**3, inout:t=>t<.5?4*t*t*t:1-(-2*t+2)**3/2,
  expo:t=>t>=1?1:1-2**(-10*t), expoIn:t=>t<=0?0:2**(10*t-10),
  back:t=>{const c1=1.7,c3=c1+1,u=t-1;return 1+c3*u*u*u+c1*u*u},
  bounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375},
};
const k=(t,a,b,e=E.out)=>e(clamp((t-a)/(b-a),0,1));
function mulberry(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const type=(s,t,a,cps=28)=>s.slice(0,clamp(Math.floor((t-a)*cps),0,s.length));
const beatPulse=t=>Math.exp(-((t%(60/BPM)))*9);

// ================================================================ tuval ve düzen
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const scv=document.createElement('canvas'), sctx=scv.getContext('2d');
const gcv=document.createElement('canvas'), gctx=gcv.getContext('2d');
const rcv=document.createElement('canvas'), rctx=rcv.getContext('2d');
let SW=1080, SH=1920, PORT=true, M=1080, VIG=null, GRID=null;
function layout(){
  PORT=RENDER?!QS.has('h'):innerHeight>=innerWidth;
  SW=PORT?1080:1920;SH=PORT?1920:1080;M=Math.min(SW,SH);
  for(const c of [cv,scv,gcv,rcv]){c.width=SW;c.height=SH}
  const s=RENDER?1:Math.min(innerWidth/SW,innerHeight/SH);
  cv.style.width=SW+'px';cv.style.height=SH+'px';cv.style.transform=`translate(-50%,-50%) scale(${s})`;
  VIG=ctx.createRadialGradient(SW/2,SH/2,M*.35,SW/2,SH/2,Math.hypot(SW,SH)*.62);
  VIG.addColorStop(0,'rgba(0,0,0,0)');VIG.addColorStop(1,'rgba(0,0,0,.42)');
  // nokta ızgarası deseni
  const g=document.createElement('canvas');g.width=g.height=44;const gc=g.getContext('2d');gc.fillStyle='rgba(233,228,216,.13)';gc.fillRect(21,21,2.4,2.4);
  GRID=ctx.createPattern(g,'repeat');
  buildParticles();
}

// ================================================================ yazı
const FAM={a:'"Archivo","Arial Black",Arial,sans-serif',m:'"JetBrains Mono",ui-monospace,monospace'};
function font(c,size,{w=900,st='normal',m=false,ls=0}={}){
  c.font=`${w} ${size}px ${m?FAM.m:FAM.a}`;
  c.fontStretch=st;
  c.letterSpacing=ls?ls+'px':'0px';
}
const WIDE={st:'expanded'}, COND={st:'extra-condensed'};
function fit(c,text,maxW,maxH,o){font(c,100,o);const w=c.measureText(text).width;return Math.min(maxH,100*maxW/w)}
// harf harf çizim: fn(i) -> {dx,dy,a,s,fill,stroke}
function letters(c,text,cx,cy,size,o,fn){
  font(c,size,o);c.textAlign='left';c.textBaseline='middle';
  const total=c.measureText(text).width;let x0=cx-total/2;
  for(let i=0;i<text.length;i++){
    const ch=text[i],xi=x0+c.measureText(text.slice(0,i)).width,wi=c.measureText(ch).width;
    const st=fn?fn(i,ch):{};if(st.a===0)continue;
    c.save();c.globalAlpha*=st.a??1;c.translate(xi+wi/2+(st.dx||0),cy+(st.dy||0));
    if(st.s!==undefined&&st.s!==1)c.scale(st.s,st.s);
    if(st.sy!==undefined)c.scale(1,st.sy);
    c.textAlign='center';
    if(st.stroke){c.lineWidth=st.lw||size*.02;c.strokeStyle=st.stroke;c.strokeText(ch,0,0)}
    if(st.fill){c.fillStyle=st.fill;c.fillText(ch,0,0)}
    c.restore();
  }
  return total;
}
function text(c,s,x,y,size,o,fill,align='center'){font(c,size,o);c.textAlign=align;c.textBaseline='middle';c.fillStyle=fill;c.fillText(s,x,y)}
function rrect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}

// ================================================================ şekiller (240 noktalı dönüşüm)
const NP=240;
function resample(v){ // kapalı çokgeni çevre uzunluğuna göre NP noktaya böl
  const seg=[];let L=0;for(let i=0;i<v.length;i++){const a=v[i],b=v[(i+1)%v.length],l=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push([a,b,l]);L+=l}
  const out=[];let si=0,acc=0;
  for(let n=0;n<NP;n++){const d=n/NP*L;while(acc+seg[si][2]<d){acc+=seg[si][2];si++}const [a,b,l]=seg[si],u=(d-acc)/l;out.push([lerp(a[0],b[0],u),lerp(a[1],b[1],u)])}
  return out;
}
const SH_CIRCLE=Array.from({length:NP},(_,i)=>{const a=-Math.PI/2+i/NP*TAU;return[Math.cos(a),Math.sin(a)]});
const SH_SQUARE=resample([[0,-.82],[.82,-.82],[.82,.82],[-.82,.82],[-.82,-.82]]);
const SH_TRI=resample([[-.62,-.95],[1.02,0],[-.62,.95]]);
const morph=(A,B,p)=>A.map((a,i)=>[lerp(a[0],B[i][0],p),lerp(a[1],B[i][1],p)]);
function shape(c,pts,cx,cy,R,rot){c.beginPath();const cs=Math.cos(rot),sn=Math.sin(rot);pts.forEach(([x,y],i)=>{const X=cx+(x*cs-y*sn)*R,Y=cy+(x*sn+y*cs)*R;i?c.lineTo(X,Y):c.moveTo(X,Y)});c.closePath()}
// referans tarzı yörünge izleri
function orbits(c,cx,cy,R,t,alpha=1){
  const cols=[C.p,C.y,C.o,C.b];
  for(let j=0;j<4;j++){const sp=(j%2?-1:1)*(1.1+j*.25),base=t*sp+j*1.7,rr=R*(1.28+j*.07);
    for(let q=0;q<22;q++){const a=base-q*.045*Math.sign(sp);c.globalAlpha=alpha*(1-q/22);c.fillStyle=cols[j];
      c.beginPath();c.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.96,(7-q*.25)*M/1080,0,TAU);c.fill()}}
  c.globalAlpha=1;
}
function callout(c,t,a,cx,cy,R,ang,l1,l2){
  const p=k(t,a,a+.35,E.expo);if(p<=0)return;
  const x0=cx+Math.cos(ang)*R,y0=cy+Math.sin(ang)*R;
  let x1=cx+R*1.08,y1=cy-R*1.12;
  font(c,26,{m:true,w:700,ls:3});const tw=Math.max(c.measureText(l1).width,c.measureText(l2).width);
  x1=Math.min(x1,SW-60-tw);
  c.strokeStyle='rgba(233,228,216,.6)';c.lineWidth=2;c.beginPath();c.moveTo(x0,y0);c.lineTo(lerp(x0,x1,p),lerp(y0,y1,p));c.lineTo(lerp(x0,x1,p)+tw*p,lerp(y0,y1,p));c.stroke();
  c.fillStyle=C.cream;c.textAlign='left';c.textBaseline='bottom';c.fillText(type(l1,t,a+.15,40),x1,y1-10);
  font(c,20,{m:true,w:500,ls:2});c.fillStyle='rgba(233,228,216,.65)';c.textBaseline='top';c.fillText(type(l2,t,a+.3,48),x1,y1+10);
}

// ================================================================ parçacıklar (final yazısı)
let PARTS=[], SIGN=null;
function signLayout(c){const size=fit(c,'BOTFUSIONS',SW*.86,SH*.13,{...WIDE,w:900});return{size,cx:SW/2,cy:SH*.46}}
function buildParticles(){
  const c=document.createElement('canvas');c.width=SW;c.height=SH;const x=c.getContext('2d');
  SIGN=signLayout(x);font(x,SIGN.size,{...WIDE,w:900});x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.fillText('BOTFUSIONS',SIGN.cx,SIGN.cy);
  SIGN.w=x.measureText('BOTFUSIONS').width;SIGN.xBot=SIGN.cx-SIGN.w/2+x.measureText('BOT').width;
  const d=x.getImageData(0,0,SW,SH).data,r=mulberry(4242),st=Math.max(4,Math.round(SIGN.size/34));PARTS=[];
  for(let y=0;y<SH;y+=st)for(let X=0;X<SW;X+=st)if(d[(y*SW+X)*4+3]>140){
    const q=r();PARTS.push({tx:X+(r()-.5)*st*.6,ty:y+(r()-.5)*st*.6,r0:.35+r()*.75,th:r()*TAU,w:r(),
      col:q<.08?C.o:q<.14?C.y:(X<SIGN.xBot?C.cream:C.p),sz:1.8+r()*1.6})}
}
function swirlPos(p,t){const u=clamp((t-24)/2,0,1),r=p.r0*(1.2-.5*E.inout(u))*M*.55,th=p.th+(.7+p.w)*(t-24)*2.3+.9*u*u;
  return[SW/2+Math.cos(th)*r,SH*.47+Math.sin(th)*r*(PORT?1.25:.8)]}

// ================================================================ sahneler (çekimler)
// Her çekim: [başlangıç, bitiş, çizim]. Kesmeler 120 BPM vuruşlarına denk gelir (1 vuruş = 0,5 sn).
function bgGrid(c,col=C.ink){c.fillStyle=col;c.fillRect(0,0,SW,SH);c.fillStyle=GRID;c.fillRect(0,0,SW,SH)}
const SHOTS=[
[0,.75,(c,t,l)=>{ // nokta, krem çember ekranı yutar
  c.fillStyle=C.ink;c.fillRect(0,0,SW,SH);
  let r=12*E.back(k(l,.08,.35))*(1+.18*Math.sin(l*22)*(l<.5?1:0));
  const g=E.expoIn(k(l,.48,.75));r=lerp(r,Math.hypot(SW,SH)*.62,g);
  c.fillStyle=C.cream;c.beginPath();c.arc(SW/2,SH/2,Math.max(0,r),0,TAU);c.fill();
}],
[.75,2.25,(c,t,l)=>{ // MÜŞTERİLERİN ARTIK / GOOGLE'A / DEĞİL, + çizgi + şeritli silme
  c.fillStyle=C.cream;c.fillRect(0,0,SW,SH);
  const big=fit(c,"GOOGLE'A",SW*.86,SH*.2,{...WIDE,w:900}),cy=SH/2;
  const sm=Math.min(64,fit(c,'MÜŞTERİLERİN ARTIK',SW*.8,64,{...WIDE,w:800}));
  letters(c,'MÜŞTERİLERİN ARTIK',SW/2,cy-big*.72,sm,{...WIDE,w:800},i=>{const p=k(t,.82+i*.018,1.2+i*.018,E.expo);return{a:p,dy:(1-p)*30,fill:C.ink}});
  const w=letters(c,"GOOGLE'A",SW/2,cy,big,{...WIDE,w:900},i=>{const p=k(t,.9+i*.045,1.35+i*.045,E.back);return{a:clamp(p*2,0,1),dy:(1-p)*big*.5,fill:C.ink}});
  letters(c,'DEĞİL,',SW/2,cy+big*.72,sm,{...WIDE,w:800},i=>{const p=k(t,1.25+i*.03,1.6+i*.03,E.expo);return{a:p,dy:(1-p)*30,fill:C.o}});
  const s=k(t,1.45,1.8,E.expo);c.fillStyle=C.o;c.fillRect(SW/2-w/2-10,cy-big*.06,(w+20)*s,big*.12);
  // çapraz şeritli silme (turuncu)
  const e=E.inout(k(t,1.86,2.25)),edge=lerp(-SW*.45,SW*1.45,e),sk=SH*.35;
  if(e>0){c.fillStyle=C.o;c.beginPath();c.moveTo(-SW,0);c.lineTo(edge+sk,0);c.lineTo(edge-sk,SH);c.lineTo(-SW,SH);c.fill();
    for(let i=1;i<=4;i++){const x=edge+i*38;c.globalAlpha=.9-i*.18;c.beginPath();c.moveTo(x+sk,0);c.lineTo(x+sk+16,0);c.lineTo(x-sk+16,SH);c.lineTo(x-sk,SH);c.fill()}c.globalAlpha=1}
}],
[2.25,3.5,(c,t,l)=>{ // YAPAY / ZEKÂYA / SORUYOR.
  c.fillStyle=C.o;c.fillRect(0,0,SW,SH);
  const size=fit(c,'ZEKÂYA',SW*.88,SH*.2,{...WIDE,w:900}),cy=SH/2-size*.2;
  const out=E.expoIn(k(t,3.28,3.5))*SW*1.3;
  ['YAPAY','ZEKÂYA'].forEach((s,i)=>{const p=E.expo(k(l,.0+i*.12,.42+i*.12,E.lin));
    letters(c,s,SW/2+(1-p)*SW*.95-out,cy+(i-.5)*size*.98,size,{...WIDE,w:900},()=>({fill:C.ink,a:p>0?1:0}))});
  text(c,type('SORUYOR.',t,2.75,22),SW/2-out,cy+size*1.25,Math.min(76,size*.45),{m:true,w:700,ls:8},C.cream);
}],
[3.5,5.75,(c,t,l)=>{ // MARKAN yankı yığını, dolu satır kaybolur, GÖRÜNMEZ damgası
  c.fillStyle=C.cream;c.fillRect(0,0,SW,SH);
  const size=fit(c,'MARKAN',SW*.8,SH*.13,{...WIDE,w:900}),rh=size*1.02,cy=SH/2;
  const n=Math.ceil(SH/rh/2)+1,off=(l*size*.45)%rh,fade=1-k(t,4.55,5.05,E.inout);
  for(let j=-n;j<=n;j++){const d=Math.abs(j),p=k(l,.05*d,.05*d+.45,E.expo);if(p<=0)continue;
    const y=cy+j*rh+(j===0?0:off*(j>0?1:-1));
    letters(c,'MARKAN',SW/2,y,size,{...WIDE,w:900},i=>j===0?{a:p,stroke:C.ink,lw:size*.018,fill:fade>0.01?(i===1?`rgba(168,85,247,${fade})`:`rgba(12,11,16,${fade})`):null}:{a:p*(1-d*.08),stroke:C.ink,lw:size*.014})}
  const sp=k(t,5.0,5.28,E.back);if(sp>0){
    const ss=fit(c,'GÖRÜNMEZ',SW*.62,SH*.075,{...WIDE,w:900});
    c.save();c.translate(SW/2,cy);c.rotate(-.12);c.scale(lerp(1.7,1,sp),lerp(1.7,1,sp));c.globalAlpha=clamp(sp*1.5,0,1);
    font(c,ss,{...WIDE,w:900});const w=c.measureText('GÖRÜNMEZ').width;
    c.fillStyle=C.cream;rrect(c,-w/2-34,-ss*.75,w+68,ss*1.5,10);c.fill();c.lineWidth=7;c.strokeStyle=C.o;c.stroke();
    c.fillStyle=C.o;c.textAlign='center';c.textBaseline='middle';c.fillText('GÖRÜNMEZ',0,ss*.04);c.restore();
    text(c,type('AI YANITLARINDA YOKSUN.',t,5.2,40),SW/2,cy+ss*1.55,30,{m:true,w:700,ls:4},C.ink)}
}],
[5.75,8.0,(c,t,l)=>{ // AI sohbet kartı: marka sona düşer, sonra 1. sıraya fırlar
  bgGrid(c);
  const w=Math.min(860,SW*.86),rh=100,h=120+118+4*rh+40,x0=(SW-w)/2,y0=SH/2-h/2;
  const ep=k(l,0,.3,E.expo);c.save();c.globalAlpha=ep;c.translate(SW/2,SH/2);c.scale(lerp(.9,1,ep),lerp(.9,1,ep));c.translate(-SW/2,-SH/2);
  c.fillStyle=C.card;rrect(c,x0,y0,w,h,[30,30,30,8]);c.fill();c.strokeStyle='rgba(233,228,216,.14)';c.lineWidth=2;c.stroke();
  c.fillStyle=C.b;c.beginPath();c.arc(x0+44,y0+56,8,0,TAU);c.fill();text(c,'AI ASİSTAN',x0+64,y0+57,24,{m:true,w:700,ls:4},'rgba(233,228,216,.7)','left');
  const q='En iyi diş kliniği hangisi?',qs=type(q,t,5.85,40);font(c,34,{w:700});const qw=c.measureText(q).width+56;
  c.fillStyle=C.pd;rrect(c,x0+w-40-qw,y0+100,qw,76,[24,24,6,24]);c.fill();c.fillStyle=C.cream;c.textAlign='left';c.textBaseline='middle';c.fillText(qs,x0+w-40-qw+28,y0+139);
  const mv=E.inout(k(t,7.05,7.55)),ry=y0+238,names=['Klinik A','Klinik B','Klinik C'];
  for(let i=0;i<4;i++){const brand=i===3,p=k(t,6.5+i*.1,6.85+i*.1,E.expo);if(p<=0)continue;
    const slot=brand?lerp(3,0,mv):i+mv,y=ry+slot*rh+(1-p)*24,x=x0+36,rw=w-72;c.globalAlpha=ep*p;
    if(brand){const sol=k(t,7.45,7.6);
      c.setLineDash([12,8]);c.strokeStyle=`rgba(249,115,22,${.85*(1-sol)})`;c.lineWidth=3;rrect(c,x,y,rw,rh-16,14);c.stroke();c.setLineDash([]);

    if(i===3){const fs=m*.13;for(let j=0;j<7;j++){const yy=y+fs*.8+j*fs*1.05,dir=j%2?1:-1,off=((t*220*dir)%(fs*4.2));font(c,fs,{...WIDE,w:900});c.textAlign='left';c.textBaseline='middle';const s='GEO — GEO — GEO — GEO — ';
      if(j%2){c.fillStyle=C.o;c.fillText(s,x-fs*4.2+off,yy)}else{c.strokeStyle=C.ink;c.lineWidth=2;c.strokeText(s,x-fs*4.2+off,yy)}}}
    c.restore()});
  c.fillStyle=C.ink;c.fillRect(hw-3,0,6,SH);c.fillRect(0,hh-3,SW,6);
}

let SHOT_A=t=>{for(let i=SHOTS.length-1;i>=0;i--)if(t>=SHOTS[i][0])return SHOTS[i][0];return 0};
function drawScene(c,t){
  t=clamp(t,0,DUR);let s=SHOTS[0];for(const sh of SHOTS)if(t>=sh[0])s=sh;
  c.save();c.globalAlpha=1;c.globalCompositeOperation='source-over';s[2](c,t,t-s[0]);c.restore();
}

// ================================================================ son işlem: glitch, HUD, gren, vinyet
const GLITCH=[[5.75,.22],[7.5,.18],[8.0,.1],[12.0,.12],[21.0,.1],[23.45,.3],[24.0,.12]];
function glitch(t,fi){
  let I=0;for(const [a,d] of GLITCH)if(t>=a&&t<a+d)I=Math.max(I,1-(t-a)/d);if(I<=0||REDUCED)return;
  gctx.clearRect(0,0,SW,SH);gctx.drawImage(cv,0,0);
  const r=mulberry(fi*977+13),o=Math.round(18*I*M/1080);
  // RGB kanal kayması: kırmızı ve camgöbeği kopyalar yan yana
  rctx.globalCompositeOperation='source-over';rctx.clearRect(0,0,SW,SH);rctx.drawImage(gcv,0,0);rctx.globalCompositeOperation='multiply';rctx.fillStyle='#ff0000';rctx.fillRect(0,0,SW,SH);
  gctx.globalCompositeOperation='multiply';gctx.fillStyle='#00ffff';gctx.fillRect(0,0,SW,SH);gctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#000';ctx.fillRect(0,0,SW,SH);ctx.globalCompositeOperation='lighter';ctx.drawImage(rcv,o,0);ctx.drawImage(gcv,-o,0);ctx.globalCompositeOperation='source-over';
  // yatay dilim kaydırma
  gctx.drawImage(cv,0,0);
  for(let i=0;i<7;i++){const y=Math.floor(r()*SH),h=Math.floor(8+r()*SH*.06),dx=Math.round((r()-.5)*160*I*M/1080);ctx.drawImage(gcv,0,y,SW,h,dx,y,SW,h)}
}
function hud(t){
  const c=ctx,m=48*M/1080,L=46,a=clamp(t/.6,0,1);if(t>=25.9&&t<26)return;
  c.save();c.globalCompositeOperation='difference';c.globalAlpha=a;c.strokeStyle=C.cream;c.fillStyle=C.cream;c.lineWidth=3;
  [[m,m,1,1],[SW-m,m,-1,1],[m,SH-m,1,-1],[SW-m,SH-m,-1,-1]].forEach(([x,y,sx,sy])=>{c.beginPath();c.moveTo(x,y+sy*L);c.lineTo(x,y);c.lineTo(x+sx*L,y);c.stroke()});
  font(c,20,{m:true,w:700,ls:4});c.textBaseline='middle';
  c.textAlign='left';c.fillText('BOTFUSIONS / AI REEL 26',m+34,m+20);
  const f=Math.floor(t*FPS+1e-6),ss=String(Math.floor(f/FPS)).padStart(2,'0'),ff=String(f%FPS).padStart(2,'0');
  c.textAlign='right';c.fillText(`TC 00:00:${ss}:${ff}`,SW-m-34,m+20);
  let si=0;for(let i=4;i>=0;i--)if(t>=SEC[i]){si=i;break}
  for(let i=0;i<5;i++){const x=SW/2-2*26+i*26-7;c.globalAlpha=a*(i===si?1:.35);c.fillRect(x,m+13,14,14)}c.globalAlpha=a;
  const lab=`0${si+1} — ${SECN[si]}`;c.textAlign='left';c.fillText(lab,m+34,SH-m-22);c.fillRect(m+34,SH-m-4,c.measureText(lab).width*k(t,SEC[si],SEC[si]+.4,E.expo),3);
  c.textAlign='right';const beat=String(clamp(Math.floor(t*BPM/60)+1,1,60)).padStart(2,'0');
  c.fillText(PORT?`${SW}×${SH} · ${BPM}BPM · BEAT ${beat}/60`:`${SW}×${SH} · ${FPS}FPS · ${BPM}BPM · BEAT ${beat}/60`,SW-m-34,SH-m-22);
  c.restore();
}
const GRAIN=[];{const r=mulberry(7);for(let n=0;n<4;n++){const g=document.createElement('canvas');g.width=g.height=256;const x=g.getContext('2d'),im=x.createImageData(256,256);
  for(let i=0;i<im.data.length;i+=4){const v=128+(r()-.5)*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}x.putImageData(im,0,0);GRAIN.push(g)}}
function finish(t,fi){
  if(!REDUCED){const g=GRAIN[fi%4],pat=ctx.createPattern(g,'repeat'),r=mulberry(fi+1);ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.09;ctx.translate(Math.floor(r()*256),Math.floor(r()*256));ctx.fillStyle=pat;ctx.fillRect(-256,-256,SW+512,SH+512);ctx.restore()}
  ctx.fillStyle=VIG;ctx.fillRect(0,0,SW,SH);
}

// ================================================================ kare üretimi (hareket bulanıklığı: alt kare ortalaması)
function renderFrame(t,sub){
  const fi=Math.round(t*FPS);
  if(sub<=1){drawScene(ctx,t)}
  else{const sh=.5/FPS;for(let i=0;i<sub;i++){const ts=t+((i+.5)/sub-.5)*sh;drawScene(sctx,ts);ctx.globalAlpha=1/(i+1);ctx.drawImage(scv,0,0)}ctx.globalAlpha=1}
  glitch(t,fi);finish(t,fi);hud(t);
}

// ================================================================ başlat
const fontsReady=()=>Promise.all(['900 100px Archivo','700 20px "JetBrains Mono"','500 20px "JetBrains Mono"'].map(f=>document.fonts.load(f))).catch(()=>[]);
if(RENDER){
  document.querySelectorAll('.ui').forEach(e=>e.remove());
  fontsReady().then(res=>{layout();renderFrame(0,1);window.__fontsOk=res.every(a=>a&&a.length>0);window.__ready=true});
  window.__frame=i=>{renderFrame(i/FPS,+(QS.get('sub')||6));return cv.toDataURL('image/jpeg',.93)};
  return;
}
let T=0,playing=false,last=performance.now(),muted=false,started=false;
const $=id=>document.getElementById(id);
const mus=new Audio('muzik.mp3');mus.preload='auto';
const musicAt=t=>{try{mus.currentTime=t;mus.muted=muted;const p=mus.play();if(p)p.catch(()=>{})}catch(e){}};
function syncBtn(){$('play').textContent=playing?'❚❚':'▶';$('play').setAttribute('aria-label',playing?'Duraklat':'Oynat')}
function seek(t){T=clamp(t,0,DUR);playing=true;last=performance.now();syncBtn();musicAt(T)}
$('go').onclick=()=>{started=true;$('start').classList.add('hidden');$('ctl').classList.remove('hidden');seek(0)};
SECN.forEach((n,i)=>{const b=document.createElement('button');b.setAttribute('aria-label',`${i+1}. bölüm: ${n}`);b.title=n;b.onclick=()=>seek(SEC[i]);$('dots').appendChild(b)});
$('play').onclick=()=>{if(!playing&&T>=DUR){seek(0);return}playing=!playing;last=performance.now();syncBtn();if(playing)musicAt(T);else mus.pause()};
$('replay').onclick=()=>seek(0);
$('mute').onclick=()=>{muted=!muted;mus.muted=muted;$('mute').textContent=muted?'SES KAPALI':'SES AÇIK'};
addEventListener('keydown',e=>{if(!started)return;if(e.code==='Space'){e.preventDefault();$('play').click()}else if(e.key==='r'||e.key==='R')seek(0);else if(/^[1-5]$/.test(e.key))seek(SEC[+e.key-1])});
let idle;const wake=()=>{$('ctl').classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>{if(playing)$('ctl').classList.add('idle')},2600)};['pointermove','pointerdown','keydown'].forEach(ev=>addEventListener(ev,wake));
addEventListener('resize',()=>{layout()});
function loop(now){
  requestAnimationFrame(loop);const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){const live=!mus.paused&&!mus.ended&&mus.readyState>=2;T=live?mus.currentTime:T+dt;if(T>=DUR){T=DUR;playing=false;syncBtn()}}
  renderFrame(T,1);
  $('clock').textContent=`${T.toFixed(1).padStart(4,'0')} / 30`;
  let si=0;for(let i=4;i>=0;i--)if(T>=SEC[i]){si=i;break}document.querySelectorAll('#dots button').forEach((b,i)=>b.classList.toggle('on',i===si));
}
fontsReady().then(()=>{layout();syncBtn();requestAnimationFrame(loop)});
})();
</script>
