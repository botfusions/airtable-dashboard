<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Botfusions Reel v3</title>
<meta name="description" content="Botfusions'ı 30 saniyede, 128 BPM'e kesilen 3D ve shader tabanlı dikey reel ile anlatan animasyon.">
<style>
@font-face{font-family:"Archivo V";font-style:normal;font-weight:100 900;font-stretch:62% 125%;src:url(lib/archivo-latin-wdth-normal.woff2) format("woff2-variations");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Archivo V";font-style:normal;font-weight:100 900;font-stretch:62% 125%;src:url(lib/archivo-latin-ext-wdth-normal.woff2) format("woff2-variations");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"JB Mono";font-style:normal;font-weight:700;src:url(lib/jetbrains-mono-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"JB Mono";font-style:normal;font-weight:700;src:url(lib/jetbrains-mono-latin-ext-700-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
/* Bilinçli tek görsel dünya: koyu sahne, Botfusions renkleri */
:root{--ink:#0C0B10;--cream:#E9E4D8;--p:#A855F7;--line:rgba(233,228,216,.16);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--cream);overflow:hidden;font-family:"JB Mono",ui-monospace,monospace}
#cv{position:absolute;left:50%;top:50%;display:block;transform-origin:center}
.ui{position:fixed;z-index:3;transition:opacity .5s}
#start{inset:0;display:grid;place-items:center;background:rgba(12,11,16,.5)}
#start button{font-size:16px;padding:16px 26px;background:var(--p);min-height:52px}
#start small{display:block;margin-top:14px;text-align:center;opacity:.75;font-size:12px;letter-spacing:.1em}
#ctl{left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:rgba(12,11,16,.78);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:calc(100vw - 32px)}
#ctl.idle{opacity:0}
button{appearance:none;border:0;background:transparent;color:var(--cream);font:700 13px/1 "JB Mono",ui-monospace,monospace;letter-spacing:.04em;padding:10px 13px;border-radius:999px;cursor:pointer;min-height:40px;white-space:nowrap}
button:hover{background:rgba(233,228,216,.1)}
button:focus-visible{outline:2px solid var(--p);outline-offset:2px}
#play{background:var(--p);min-width:44px}
#clock{font-size:12px;opacity:.7;padding:0 8px;min-width:58px;font-variant-numeric:tabular-nums}
.hidden{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv" role="img" aria-label="Botfusions reel v3: AI seni öneriyor mu? Botfusions markanı yapay zekâ yanıtlarına taşır."></canvas>
<div id="start" class="ui"><div><button id="go">▶ Sesli oynat</button><small>30 SN · 128 BPM · 9:16</small></div></div>
<div id="ctl" class="ui hidden"><button id="play" aria-label="Duraklat">❚❚</button><button id="replay">↺ Baştan</button><span id="clock">00.0 / 30</span><button id="mute">SES AÇIK</button></div>
<script src="lib/three.min.js"></script>
<script>
(()=>{
'use strict';
// ====================================================================== içerik
// KANIT: doğrulanmış rakam gelince value doldurulur (ör. {value:'3X',label:'AI YANITLARINDA DAHA SIK ÖNERİLME'})
const PROOF={value:null,label:'BURAYA DOĞRULANMIŞ RAKAM'};

const QS=new URLSearchParams(location.search), RENDER=QS.has('render');
const W=1080,H=1920,ASP=W/H,BPM=128,BT=60/BPM,DUR=30,FPS=30;
const b=n=>n*BT;
const C={ink:'#0C0B10',cream:'#E9E4D8',p:'#A855F7',pd:'#7C3AED',b:'#3B82F6',o:'#F97316',y:'#FDE047',pink:'#F9A8D4',card:'#17122B',navy:'#140C24'};
const clamp=(x,a,c)=>x<a?a:x>c?c:x, lerp=(a,c,x)=>a+(c-a)*x, TAU=Math.PI*2;
const E={lin:t=>t,out:t=>1-(1-t)**3,inout:t=>t<.5?4*t*t*t:1-(-2*t+2)**3/2,expo:t=>t>=1?1:1-2**(-10*t),expoIn:t=>t<=0?0:2**(10*t-10),
  back:t=>{const c1=2.0,c3=c1+1,u=t-1;return 1+c3*u*u*u+c1*u*u},
  elastic:t=>t<=0?0:t>=1?1:2**(-10*t)*Math.sin((t*10-.75)*TAU/3)+1,
  bounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375}};
const k=(x,a,c,e=E.out)=>e(clamp((x-a)/(c-a),0,1));
function mulberry(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ====================================================================== renderer ve sahneler
const cv=document.getElementById('cv');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:!RENDER,preserveDrawingBuffer:RENDER,alpha:false,powerPreference:'high-performance'});
R.setPixelRatio(1);R.setSize(W,H,false);
const fit=()=>{const s=RENDER?1:Math.min(innerWidth/W,innerHeight/H);cv.style.width=W+'px';cv.style.height=H+'px';cv.style.transform=`translate(-50%,-50%) scale(${s})`};fit();addEventListener('resize',fit);
const ortho=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const quad=m=>{const s=new THREE.Scene();s.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),m));return s};
const VS='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';

// --- arka plan shader'ı: 7 mod
const BG=new THREE.ShaderMaterial({depthWrite:false,depthTest:false,vertexShader:VS,uniforms:{uMode:{value:0},uA:{value:new THREE.Color()},uB:{value:new THREE.Color()},uC:{value:new THREE.Color()},uT:{value:0},uP:{value:1},uAsp:{value:ASP}},
fragmentShader:`precision highp float;varying vec2 vUv;uniform float uMode,uT,uP,uAsp;uniform vec3 uA,uB,uC;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p*=2.03;a*=.5;}return v;}
void main(){vec2 p=(vUv-.5)*vec2(uAsp,1.)*2.;float r=length(p),a=atan(p.y,p.x);vec3 col;
 if(uMode<.5){col=uA;vec2 g=fract((p+vec2(0.,uT*.12))*9.)-.5;col=mix(col,uB,smoothstep(.1,.05,length(g))*.55);col+=uC*.28*exp(-r*r*1.6);}
 else if(uMode<1.5){float s=step(.5,fract(a/6.2831853*18.+uT*uP));col=mix(uA,uB,s);col=mix(col,uC,exp(-r*r*5.)*.7);}
 else if(uMode<2.5){float z=.34/max(r,.02)+uT*uP;float s=step(.5,fract(z));float s2=step(.5,fract(a/6.2831853*12.+uT*.1));col=mix(uA,uB,mod(s+s2,2.));col*=smoothstep(0.,.55,r);col+=uC*exp(-r*7.)*1.2;}
 else if(uMode<3.5){vec2 q=p*1.35;vec2 w=vec2(fbm(q+uT*.35),fbm(q+vec2(5.2,1.3)-uT*.28));float f=fbm(q+2.3*w+uT*.15);col=mix(uA,uB,smoothstep(.28,.72,f));col=mix(col,uC,smoothstep(.55,.85,w.x)*.85);}
 else if(uMode<4.5){float sw=a+1.3/(r+.22)+uT*1.2;vec2 q=vec2(cos(sw),sin(sw))*r*2.2;float f=fbm(q*1.6+uT*.4);col=mix(uA,uB,f*1.2);
   float rim=exp(-abs(r-uP)*16.)*1.5;col=mix(col,vec3(.015,0.,.03),smoothstep(uP+.004,uP-.012,r));col+=uC*rim;}
 else if(uMode<5.5){float kk=6.2831853/8.;float aa=mod(a+uT*.5,kk);aa=abs(aa-kk*.5);vec2 q=vec2(cos(aa),sin(aa))*r;float f=sin(q.x*13.-uT*7.)*sin(q.y*13.+uT*5.);col=mix(uA,uB,step(0.,f));col=mix(col,uC,step(.82,abs(f)));}
 else{vec2 q=p+.2*sin(p.yx*3.+uT*2.5);float c=step(0.,sin(q.x*6.5+uT*2.)*sin(q.y*6.5-uT));col=mix(uA,uB,c);}
 gl_FragColor=vec4(col,1.);}`});
const bgScene=quad(BG);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(50,ASP,.05,200);
scene.add(new THREE.AmbientLight(0xffffff,.55));
const key=new THREE.DirectionalLight(0xffffff,.75);key.position.set(2,4,6);scene.add(key);
const rim=new THREE.DirectionalLight(0xA855F7,.5);rim.position.set(-4,-2,-3);scene.add(rim);

// --- hareket bulanıklığı birikimi ve son işlem
const RT=()=>new THREE.WebGLRenderTarget(W,H,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,depthBuffer:true});
const rtS=RT(),rtA=RT();
const ACC=new THREE.ShaderMaterial({transparent:true,depthTest:false,depthWrite:false,blending:THREE.CustomBlending,blendSrc:THREE.SrcAlphaFactor,blendDst:THREE.OneMinusSrcAlphaFactor,vertexShader:VS,
  uniforms:{tex:{value:null},w:{value:1}},fragmentShader:'varying vec2 vUv;uniform sampler2D tex;uniform float w;void main(){gl_FragColor=vec4(texture2D(tex,vUv).rgb,w);}'});
const accScene=quad(ACC);
const POST=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,vertexShader:VS,
  uniforms:{tex:{value:null},uCA:{value:0},uPunch:{value:0},uFlash:{value:new THREE.Color(0,0,0)},uRad:{value:0},uT:{value:0},uRes:{value:new THREE.Vector2(W,H)}},
  fragmentShader:`precision highp float;varying vec2 vUv;uniform sampler2D tex;uniform float uCA,uPunch,uRad,uT;uniform vec3 uFlash;uniform vec2 uRes;
  float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
  void main(){vec2 c=vUv-.5;vec2 uv=.5+c*(1.-uPunch*.16);uv+=c*dot(c,c)*uPunch*.35;vec3 col;
   if(uRad>.001){vec3 s=vec3(0.);for(int i=0;i<10;i++){float f=1.-float(i)*uRad*.018;s+=texture2D(tex,.5+(uv-.5)*f).rgb;}col=s/10.;}else col=texture2D(tex,uv).rgb;
   if(uCA>.001){vec2 d=(uv-.5)*uCA*.045+vec2(uCA*.004,0.);col.r=mix(col.r,texture2D(tex,uv+d).r,.9);col.b=mix(col.b,texture2D(tex,uv-d).b,.9);}
   col+=uFlash;col*=1.-.38*smoothstep(.35,1.,length(c*vec2(1.,.72))*1.35);
   col+=(hash(floor(vUv*uRes*.5)+floor(uT*30.)*7.13)-.5)*.07;gl_FragColor=vec4(col,1.);}`});
const postScene=quad(POST);

// --- HUD (bulanıklığa girmez)
const hudCv=document.createElement('canvas');hudCv.width=W;hudCv.height=H;const hx=hudCv.getContext('2d');
const hudTex=new THREE.CanvasTexture(hudCv);hudTex.minFilter=THREE.LinearFilter;
const hudScene=quad(new THREE.MeshBasicMaterial({map:hudTex,transparent:true,depthTest:false,depthWrite:false}));
hudScene.children[0].geometry=new THREE.PlaneGeometry(2,2);
// Ortho kamera ile ham konum kullanan malzeme gerekir: basit shader
hudScene.children[0].material=new THREE.ShaderMaterial({transparent:true,depthTest:false,depthWrite:false,vertexShader:VS,uniforms:{tex:{value:hudTex}},fragmentShader:'varying vec2 vUv;uniform sampler2D tex;void main(){gl_FragColor=texture2D(tex,vUv);}'});

// ====================================================================== yazı dokuları
const FA='"Archivo V","Arial Black",Arial,sans-serif',FM='"JB Mono",ui-monospace,monospace';
function font(x,size,{w=900,st='expanded',m=false}={}){x.font=`${w} ${size}px ${m?FM:FA}`;x.fontStretch=m?'normal':st}
function makeTex(str,o={}){
  const size=o.size||220,pad=o.pad??Math.round(size*.22),c=document.createElement('canvas'),x=c.getContext('2d');
  font(x,size,o);const tw=Math.ceil(x.measureText(str).width);
  c.width=tw+pad*2;c.height=Math.ceil(size*1.18)+pad*2;font(x,size,o);x.textAlign='center';x.textBaseline='middle';
  const cx=c.width/2,cy=c.height/2+size*.05;
  if(o.bg){x.fillStyle=o.bg;x.beginPath();x.roundRect(pad*.35,pad*.35,c.width-pad*.7,c.height-pad*.7,o.r??size*.2);x.fill();if(o.bgStroke){x.lineWidth=size*.05;x.strokeStyle=o.bgStroke;x.stroke()}}
  if(o.stroke){x.lineJoin='round';x.lineWidth=o.lw||size*.12;x.strokeStyle=o.stroke;x.strokeText(str,cx,cy)}
  if(o.fill!==null){x.fillStyle=o.fill||'#fff';x.fillText(str,cx,cy)}
  if(o.outline){x.lineWidth=o.lw||size*.03;x.strokeStyle=o.outline;x.strokeText(str,cx,cy)}
  if(o.strike){x.fillStyle=o.strike;x.fillRect(pad*.6,cy-size*.08,c.width-pad*1.2,size*.14)}
  const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;return{t,a:c.width/c.height};
}
const TEXTS=[];
function T(str,o={},maxW=4.7,maxH=3.2){
  const tx=makeTex(str,o),w=Math.min(maxW,maxH*tx.a);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,w/tx.a),new THREE.MeshBasicMaterial({map:tx.t,transparent:true,depthWrite:false,depthTest:false}));
  m.renderOrder=20;m.visible=false;m.userData.w=w;scene.add(m);TEXTS.push(m);return m;
}
const CAMFIX=[];
// kamera uzayında sabit (ekranda yer tutan) yazı: d = kameradan uzaklık
function showCam(m,{x=0,y=0,d=8.5,s=1,o=1}={}){if(o<=.002||s<=.001)return;m.visible=true;m.scale.set(s,s,1);m.material.opacity=o;CAMFIX.push([m,x,y,d])}
function show(m,{x=0,y=0,z=0,s=1,sx=1,sy=1,rx=0,ry=0,rz=0,o=1}={}){if(o<=.002||s<=.001)return;m.visible=true;m.position.set(x,y,z);m.scale.set(s*sx,s*sy,1);m.rotation.set(rx,ry,rz);m.material.opacity=o}
const big=(fill,stroke)=>({size:230,st:'expanded',fill,stroke,lw:30});
const cond=(fill,stroke)=>({size:260,st:'extra-condensed',fill,stroke,lw:30});
const mono=(fill,bg)=>({size:64,m:true,w:700,fill,bg,pad:26,r:14});

// ====================================================================== küpler (3000 örnek)
const N=3000;
const VOX=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({color:0xffffff}),N);
VOX.instanceMatrix.setUsage(THREE.DynamicDrawUsage);VOX.frustumCulled=false;scene.add(VOX);
const dummy=new THREE.Object3D(),colTmp=new THREE.Color();
for(let i=0;i<N;i++)VOX.setColorAt(i,colTmp.set('#ffffff'));
const rnd=mulberry(2026),RND=Array.from({length:N},()=>[rnd(),rnd(),rnd(),rnd(),rnd(),rnd()]);
// nokta kümeleri
function textPts(str,worldW,st,layers=2){
  const c=document.createElement('canvas'),x=c.getContext('2d');font(x,400,{w:900,st});const tw=x.measureText(str).width;
  c.width=Math.ceil(tw+40);c.height=520;font(x,400,{w:900,st});x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.fillText(str,c.width/2,c.height/2+20);
  const d=x.getImageData(0,0,c.width,c.height).data,sc=worldW/tw;let step=4,pts=[];
  for(;step<40;step++){pts=[];for(let y=0;y<c.height;y+=step)for(let X=0;X<c.width;X+=step)if(d[(y*c.width+X)*4+3]>128)pts.push([X,y]);if(pts.length*layers<=N)break}
  const out=[];pts.forEach(([X,y])=>{for(let l=0;l<layers;l++)out.push([(X-c.width/2)*sc,-(y-c.height/2-20)*sc,-l*step*sc,X/c.width])});
  return{pts:out,cell:step*sc};
}
const fib=(i,n,r)=>{const y=1-2*(i+.5)/n,rr=Math.sqrt(1-y*y),a=i*2.399963;return[Math.cos(a)*rr*r,y*r,Math.sin(a)*rr*r]};
let P_MARKAN,P_BOTF,P_SPHERE,P_LAT,P_INF;
function buildSets(){
  P_MARKAN=textPts('MARKAN',4.6,'expanded',2);
  P_BOTF=textPts('BOTFUSIONS',4.7,'extra-condensed',2);
  P_SPHERE=Array.from({length:N},(_,i)=>fib(i,N,1.75));
  const L=14;P_LAT=Array.from({length:N},(_,i)=>{if(i>=L*L*L)return null;const a=i%L,c=Math.floor(i/L)%L,d=Math.floor(i/L/L);return[(a-(L-1)/2)*.21,(d-(L-1)/2)*.21,(c-(L-1)/2)*.21,d/(L-1)]});
  P_INF=Array.from({length:N},(_,i)=>{const u=i/N*TAU*1+RND[i][0]*.002,ring=RND[i][1]*TAU,rr=.18+RND[i][2]*.12;return[u,ring,rr]});
}
const infPos=(u,ring,rr,s=2.1)=>{const d=1+Math.sin(u)**2,x=s*Math.cos(u)/d,y=s*Math.sin(u)*Math.cos(u)/d;return[x+Math.cos(ring)*rr*.4,y+Math.sin(ring)*rr,Math.sin(ring)*rr*1.2]};
let vUsed=0;
function vox(i,x,y,z,s,col,rx=0,ry=0,rz=0){dummy.position.set(x,y,z);dummy.rotation.set(rx,ry,rz);dummy.scale.set(s,s,s);dummy.updateMatrix();VOX.setMatrixAt(i,dummy.matrix);VOX.setColorAt(i,colTmp.set(col));vUsed=Math.max(vUsed,i+1)}
function voxHideFrom(n){dummy.scale.set(0,0,0);dummy.position.set(0,0,-999);dummy.updateMatrix();for(let i=n;i<N;i++)VOX.setMatrixAt(i,dummy.matrix)}
// patlama yönleri
const burst=(i,r0,r1)=>{const q=RND[i],th=q[0]*TAU,ph=Math.acos(2*q[1]-1),r=lerp(r0,r1,q[2]);return[Math.sin(ph)*Math.cos(th)*r,Math.sin(ph)*Math.sin(th)*r*1.4,Math.cos(ph)*r]};
// konfeti: düşen renkli küpler
const CONF=[C.p,C.y,C.o,C.b,C.pink,C.cream];
function confetti(from,lb,t0,cx=0,cy=0,spread=1){let n=0;for(let i=from;i<N;i++){const q=RND[i],lt=(lb-t0)*BT;if(lt<0)return;
  const vx=(q[0]-.5)*6*spread,vy=3+q[1]*5,vz=(q[2]-.5)*4,x=cx+vx*lt,y=cy+vy*lt-4.9*lt*lt,z=vz*lt+1;if(y<-6)continue;
  vox(i,x,y,z,.07+q[3]*.07,CONF[i%6],lt*9*q[4],lt*7*q[5],lt*5);n++}}

// ====================================================================== telefon arayüzü (dinamik doku)
const phCv=document.createElement('canvas');phCv.width=720;phCv.height=1300;const px=phCv.getContext('2d');
const phTex=new THREE.CanvasTexture(phCv);phTex.minFilter=THREE.LinearFilter;phTex.generateMipmaps=false;
const PHONE=new THREE.Mesh(new THREE.PlaneGeometry(3.9,3.9*1300/720),new THREE.MeshBasicMaterial({map:phTex,transparent:true,depthWrite:false,depthTest:false}));PHONE.renderOrder=15;PHONE.visible=false;scene.add(PHONE);
function drawPhone(lb,mode){
  const x=px;x.clearRect(0,0,720,1300);
  x.fillStyle='#050408';x.beginPath();x.roundRect(10,10,700,1280,90);x.fill();x.lineWidth=6;x.strokeStyle='rgba(233,228,216,.35)';x.stroke();
  x.fillStyle=C.card;x.beginPath();x.roundRect(34,34,652,1232,70);x.fill();
  x.fillStyle='#050408';x.beginPath();x.roundRect(270,54,180,40,20);x.fill();

let T0=0,playing=false,last=performance.now(),muted=false,started=false;
